<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goddys Kickbase Analyzer</title>
    <!-- Cache-Buster auf v7 -->
    <link rel="stylesheet" href="style.css?v=7">
</head>
<body>
    <div class="container">
        <!-- Login UI -->
        <div id="login-section" class="card">
            <h1>Kickbase Login</h1>
            <div class="form-group">
                <label for="email">E-Mail</label>
                <input type="email" id="email" placeholder="name@beispiel.de" required>
            </div>
            <div class="form-group">
                <label for="password">Passwort</label>
                <input type="password" id="password" placeholder="Passwort eingeben" required>
            </div>
            <button id="fetch-data-btn">Daten abrufen</button>
            <p id="error-message" class="error hidden"></p>
        </div>

        <!-- League Selection -->
        <div id="league-section" class="card hidden">
            <h2>Liga auswählen</h2>
            <div id="league-buttons" class="button-group"></div>
        </div>

        <!-- Dashboard UI -->
        <div id="dashboard-section" class="hidden">
            <div class="header-info card">
                <h2 id="league-name">Kaderübersicht</h2>
                <p id="last-update" class="text-sm"></p>
                <p id="next-match" class="text-sm font-bold"></p>
            </div>

            <!-- Finanzen / Budget -->
            <div class="card">
                <!-- Standard Budgets -->
                <div class="budget-panel" style="margin-bottom: 1rem;">
                    <div class="budget-box">
                        <span class="label">Kontostand</span>
                        <span id="budget-current" class="value">0 €</span>
                    </div>
                    <div class="budget-box">
                        <span class="label">Nach Transfers</span>
                        <span id="budget-transfers" class="value">0 €</span>
                    </div>
                    <div class="budget-box">
                        <span class="label">Nach Boni</span>
                        <span id="budget-bonus" class="value">0 €</span>
                    </div>
                </div>
                <!-- Erweiterte reale Budgets (max. Gebot) -->
                <div class="budget-panel">
                    <div class="budget-box">
                        <span class="label">Budget aktuell</span>
                        <span id="real-budget-current" class="value">0 €</span>
                    </div>
                    <div class="budget-box">
                        <span class="label">Budget nach Transfers</span>
                        <span id="real-budget-transfers" class="value">0 €</span>
                    </div>
                    <div class="budget-box">
                        <span class="label">Budget nach Boni</span>
                        <span id="real-budget-bonus" class="value">0 €</span>
                    </div>
                </div>
            </div>

            <!-- Kader Tabelle -->
            <div class="table-container card">
                <table id="squad-table">
                    <thead>
                        <tr>
                            <th>Spieler</th>
                            <th>Team</th>
                            <th class="text-right">Kaufpreis</th>
                            <th class="text-right">Marktwert</th>
                            <th class="text-center">Verkauf</th>
                            <th class="text-right">Gewinn/Verlust</th>
                        </tr>
                    </thead>
                    <tbody id="squad-body">
                        <!-- Wird via JS befüllt -->
                    </tbody>
                    <tfoot id="squad-footer">
                        <!-- Zusammenfassung via JS -->
                    </tfoot>
                </table>
            </div>
            <button id="logout-btn" class="secondary-btn mt-4">Zurück zum Login</button>
        </div>
    </div>
    <!-- Cache-Buster auf v7 -->
    <script src="app.js?v=7"></script>
</body>
</html>
